  <link rel="icon" type="image/png" href="assets/logo.png">

  <script>
    // Verhindert einen kurzen "Hellmodus-Blitz", falls der Benutzer bereits
    // den Dark Mode gewählt hat (Präferenz wird lokal je Gerät gespeichert).
    try {
      var storedTheme = localStorage.getItem('ssd_theme_pref');
      if (storedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (err) { /* localStorage evtl. nicht verfügbar */ }
  </script>

  <link rel="stylesheet" href="css/variables.css">
