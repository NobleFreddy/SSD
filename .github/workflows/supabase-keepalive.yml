name: Supabase wach halten

# Supabase pausiert Projekte im kostenlosen Tarif nach ca. 7 Tagen ohne
# Nutzung — der Dienstplan lädt dann keine Daten mehr (z. B. nach den
# Ferien). Ein Mini-Aufruf alle 3 Tage verhindert das. Aufgerufen wird die
# Funktion ssd_ping, die keinerlei Daten liefert (der direkte Tabellenzugriff
# ist für den öffentlichen Schlüssel gesperrt). URL und öffentlicher Schlüssel
# kommen aus js/core/supabaseConfig.js, damit es nur eine Stelle gibt, an der
# sie gepflegt werden.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank anpingen
        run: |
          CONFIG=js/core/supabaseConfig.js
          URL=$(sed -n "s/.*URL: '\([^']*\)'.*/\1/p" "$CONFIG")
          KEY=$(sed -n "s/.*ANON_KEY: '\([^']*\)'.*/\1/p" "$CONFIG")
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{}' "$URL/rest/v1/rpc/ssd_ping" > /dev/null
          echo "Datenbank erreichbar."
